<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#8B6914"/>
      <stop offset="48%"  stop-color="#CAA353"/>
      <stop offset="100%" stop-color="#F0C97A"/>
    </linearGradient>
    <linearGradient id="gfade" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#CAA353" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F0C97A" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- ── Bird: geometric soaring eagle ── -->
  <!-- Left wing sweep -->
  <path d="M24 20 L2 10 L11 21 L21 22 Z" fill="url(#g)"/>
  <!-- Right wing sweep -->
  <path d="M24 20 L46 10 L37 21 L27 22 Z" fill="url(#g)"/>
  <!-- Body core -->
  <ellipse cx="24" cy="22" rx="3.2" ry="3.8" fill="url(#g)"/>
  <!-- Tail fork -->
  <path d="M21.5 24 L20 30 L24 27 L28 30 L26.5 24" fill="url(#g)" opacity="0.72"/>

  <!-- ── Growth bars (ascending left → right) ── -->
  <rect x="4"  y="37" width="4.5" height="5"  rx="1" fill="url(#gfade)"/>
  <rect x="10" y="34" width="4.5" height="8"  rx="1" fill="url(#gfade)"/>
  <rect x="16" y="30" width="4.5" height="12" rx="1" fill="url(#g)" opacity="0.82"/>
  <rect x="22" y="26" width="4.5" height="16" rx="1" fill="url(#g)"/>

  <!-- ── Trend arrow (top-right) ── -->
  <polyline points="29,40 35,28 40,33" stroke="url(#g)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="35" cy="27" r="2" fill="url(#g)"/>
</svg>
